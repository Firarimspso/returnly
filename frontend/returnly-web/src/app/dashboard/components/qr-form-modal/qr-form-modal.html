<button class="backdrop" type="button" aria-label="Close QR dialog" (click)="closed.emit()"></button>
<section class="modal" role="dialog" aria-modal="true" [attr.aria-label]="qrCode() ? 'Edit QR code' : 'Create QR code'">
  <header><div class="modal-icon">⌗</div><span><h2>{{ qrCode() ? 'Edit QR code' : 'Create QR code' }}</h2><p>{{ qrCode() ? 'Update how this QR code is identified and used.' : 'Generate a trackable code for your restaurant.' }}</p></span><button type="button" aria-label="Close dialog" (click)="closed.emit()">×</button></header>
  <div class="body">
    <label class="field"><span>QR code name</span><input maxlength="60" placeholder="e.g. Table 04" [ngModel]="name()" (ngModelChange)="name.set($event)" autofocus /></label>
    <fieldset><legend>QR code type</legend><div class="types">@for (option of types; track option.value) { <button type="button" [class.selected]="type() === option.value" (click)="type.set(option.value)"><i>{{ option.icon }}</i><span><b>{{ option.value }}</b><small>{{ option.description }}</small></span><em>✓</em></button> }</div></fieldset>
    <label class="field"><span>Destination URL</span><div class="url-input"><i>↗</i><input type="url" [ngModel]="destination()" (ngModelChange)="destination.set($event)" /></div><small>This can later be replaced with a backend-generated campaign URL.</small></label>
    <label class="availability"><span><b>Active QR code</b><small>Inactive codes remain visible but cannot be scanned.</small></span><input type="checkbox" [checked]="status() === 'Active'" (change)="status.set(status() === 'Active' ? 'Inactive' : 'Active')" /><i></i></label>
    @if (error()) { <p class="error" role="alert"><span>!</span>{{ error() }}</p> }
  </div>
  <footer><button type="button" (click)="closed.emit()">Cancel</button><button class="primary" type="button" (click)="submit()">{{ qrCode() ? 'Save changes' : 'Generate QR code' }}</button></footer>
</section>
