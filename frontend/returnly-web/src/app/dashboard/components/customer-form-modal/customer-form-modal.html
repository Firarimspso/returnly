<button class="modal-backdrop" type="button" aria-label="Close dialog" (click)="closed.emit()"></button>
<section class="modal" role="dialog" aria-modal="true" aria-label="Add customer">
  <header>
    <div class="modal-icon">♙</div>
    <span><h2>Add customer</h2><p>Create a new loyalty customer profile.</p></span>
    <button class="close" type="button" aria-label="Close dialog" (click)="closed.emit()">×</button>
  </header>

  <div class="modal-body">
    <div class="form-grid">
      <label class="field">
        <span>First name</span>
        <input autocomplete="given-name" [ngModel]="firstName()" (ngModelChange)="firstName.set($event)" autofocus />
      </label>
      <label class="field">
        <span>Last name</span>
        <input autocomplete="family-name" [ngModel]="lastName()" (ngModelChange)="lastName.set($event)" />
      </label>
      <label class="field">
        <span>Phone number</span>
        <input type="tel" inputmode="tel" autocomplete="tel" maxlength="12" pattern="\+?[0-9]*" placeholder="70123456 or +96170123456" [ngModel]="phoneNumber()" (ngModelChange)="phoneNumber.set($event)" />
        @if (showPhoneError()) {
          <small class="field-error">Please enter a valid Lebanese mobile number.</small>
        }
      </label>
      <label class="field">
        <span>Email address</span>
        <input type="email" autocomplete="email" [ngModel]="email()" (ngModelChange)="email.set($event)" />
      </label>
      <label class="field">
        <span>Customer status</span>
        <select [ngModel]="status()" (ngModelChange)="status.set($event)">
          @for (option of statusOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </label>
    </div>

    @if (error()) {
      <p class="error" role="alert"><span>!</span>{{ error() }}</p>
    }
  </div>

  <footer>
    <button class="cancel" type="button" (click)="closed.emit()">Cancel</button>
    <button class="submit" type="button" [disabled]="phoneInvalid()" (click)="submit()">Add customer</button>
  </footer>
</section>
